name: Bug Report
description: Something is not working correctly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure layout with N channels
        2. Open stream in VLC
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: input
    id: plugin_version
    attributes:
      label: Plugin version
      placeholder: "please don't say latest"
    validations:
      required: true

  - type: input
    id: dispatcharr_version
    attributes:
      label: Dispatcharr version
      placeholder: "please don't say latest"
    validations:
      required: true

  # - type: dropdown
  #   id: encoder
  #   attributes:
  #     label: Video encoder
  #     options:
  #       - libx264 (software)
  #       - h264_nvenc (NVIDIA)
  #       - h264_qsv (Intel QuickSync)
  #       - h264_vaapi (AMD/Intel VA-API)
  #       - Not applicable
  #   validations:
  #     required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or FFmpeg output
      description: Paste any server logs or FFmpeg stderr output here.
      render: shell
    validations:
      required: false

  - type: markdown
    attributes:
      value: "**Screenshots are helpful for visual issues** (tiling layout problems, placeholder not clearing, etc.). Attach them to this issue after submission."
